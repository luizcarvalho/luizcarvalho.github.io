name: Atualizar artigos do Medium

on:
  schedule:
    - cron: "17 9 * * *" # todo dia, 06:17 em Brasília
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Baixar feed do Medium
        run: python3 scripts/update_articles.py

      - name: Commitar se houver mudança
        run: |
          if git diff --quiet -- assets/data/articles.json; then
            echo "Sem artigos novos."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add assets/data/articles.json
          git commit -m "chore: atualiza artigos do Medium"
          git push
